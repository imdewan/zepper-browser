name: Feature request
description: Suggest an idea for Zepper
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
